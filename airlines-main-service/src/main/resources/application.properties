spring.application.name=airlines-main-service
# Mikroservisin ismi yerine IP adresi ile kay?t olmas?n? sa?lar
eureka.instance.prefer-ip-address=true
server.port=8081
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# PostgreSQL Ba?lant? Bilgileri
spring.datasource.url=jdbc:postgresql://localhost:5432/Airlinesdb
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate Ayarlar?
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# KAFKA PRODUCER AYARLARI
spring.kafka.bootstrap-servers=localhost:9092
# Nesneleri JSON format?na çevirip göndermek için:
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# JSON serile?tirme s?ras?nda tip bilgilerini ekle (Search-service'in tan?mas? için)
spring.kafka.producer.properties.spring.json.add.type.headers=true