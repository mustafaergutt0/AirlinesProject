server:
  port: 8087 # Auth-service genellikle bu portta çalışır

spring:
  application:
    name: auth-service

  # Veritabanı Ayarları (PostgreSQL)
  datasource:
    url: jdbc:postgresql://localhost:5432/Airlinesdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # Tabloları otomatik oluşturur/günceller
    show-sql: true # Konsolda SQL sorgularını görmeni sağlar
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis Ayarları (Login Session Yönetimi için)
  data:
    redis:
      host: localhost
      port: 6379

  # Spring Session'ı Redis ile yönetmek için kritik ayar
  session:
    store-type: none
    redis:
      namespace: spring:session:auth

# Eureka Client Ayarları (Servis Kaydı)
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true # Servislerin IP üzerinden haberleşmesini sağlar